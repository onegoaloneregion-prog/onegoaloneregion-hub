        (function fill100Questions() {
            var seedLen = all100QuestionsPool.length;
            for (var i = seedLen + 1; i <= 100; i++) {
                var ref = all100QuestionsPool[(i - 1) % seedLen];
                all100QuestionsPool.push({
                    id: i,
                    diff: (i % 3 === 0) ? "困難" : ((i % 2 === 0) ? "中等" : "簡單"),
                    q: ref.q,
                    options: ref.options,
                    ans: ref.ans
                });
            }
        })();

        function restartQuizGame() { startQuizGame(); }
        
        function startQuizGame() { 
            currentQuizIndex = 0; 
            currentQuizScore = 0; 
            currentQuizStreak = 0; 
            activeQuizList = all100QuestionsPool.slice().sort(function() { return 0.5 - Math.random(); }); 
            renderQuizQuestion(); 
        }
        
        function renderQuizQuestion() {
            var fbBox = document.getElementById('quizFeedbackBox'); 
            if (fbBox) fbBox.classList.add('hidden');

            if (currentQuizIndex >= activeQuizList.length) {
                var qTxt = document.getElementById('quizQuestionText');
                var optBox = document.getElementById('quizOptionsContainer');
                if (qTxt) qTxt.innerText = "🏆 恭喜您完成全部 100 題大挑戰！OGOR 團隊因您而驕傲！";
                if (optBox) optBox.innerHTML = '<button type="button" onclick="startQuizGame()" class="w-full py-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-black rounded-2xl shadow-md hover:opacity-90 transition-all text-sm cursor-pointer">🔄 重新開始挑戰 (再次隨機 100 題)</button>';
                return;
            }

            var qObj = activeQuizList[currentQuizIndex];
            var diffTag = document.getElementById('quizDifficultyTag');
            var qTxt = document.getElementById('quizQuestionText');
            var pBar = document.getElementById('quizProgressBar');
            var sTxt = document.getElementById('quizScoreText');
            var optBox = document.getElementById('quizOptionsContainer');

            if (diffTag) diffTag.innerText = qObj.diff + " 題目 (第 " + (currentQuizIndex + 1) + " / 100 題)";
            if (qTxt) qTxt.innerText = qObj.q;
            var pct = Math.round(((currentQuizIndex) / 100) * 100);
            if (pBar) pBar.style.width = pct + "%";
            if (sTxt) sTxt.innerText = currentQuizScore + " 分 (" + currentQuizStreak + "連勝)";
            
            var optHtml = "";
            qObj.options.forEach(function(optText, idx) {
                optHtml += '<button type="button" onclick="handleQuizAnswer(' + idx + ')" class="quiz-opt-btn w-full text-left p-3.5 rounded-xl text-slate-800 font-semibold text-xs transition-all cursor-pointer flex items-center gap-3"><span class="w-6 h-6 rounded-full bg-slate-100 font-black text-slate-600 flex items-center justify-center shrink-0 text-xs">' + String.fromCharCode(65 + idx) + '</span><span>' + optText + '</span></button>';
            });
            if (optBox) optBox.innerHTML = optHtml;
        }

        function handleQuizAnswer(selectedIdx) {
            var qObj = activeQuizList[currentQuizIndex]; 
            var fbBox = document.getElementById('quizFeedbackBox'); 
            if (fbBox) fbBox.classList.remove('hidden');

            if (selectedIdx === qObj.ans) {
                currentQuizScore += 10; 
                currentQuizStreak += 1;
                var randPraise = praiseMsgList[Math.floor(Math.random() * praiseMsgList.length)];
                if (fbBox) {
                    fbBox.className = "p-4 rounded-2xl border border-emerald-200 bg-emerald-50 text-emerald-900 text-xs leading-relaxed space-y-1 transition-all";
                    fbBox.innerHTML = '<b class="text-sm block">✓ ' + randPraise + '</b><p><b>正確答案：</b>' + qObj.options[qObj.ans] + '</p>';
                }
                setTimeout(function() { currentQuizIndex++; renderQuizQuestion(); }, 1200);
            } else {
                currentQuizStreak = 0;
                var randEncourage = encourageMsgList[Math.floor(Math.random() * encourageMsgList.length)];
                if (fbBox) {
                    fbBox.className = "p-4 rounded-2xl border border-amber-200 bg-amber-50 text-amber-900 text-xs leading-relaxed space-y-1 transition-all";
                    fbBox.innerHTML = '<b class="text-sm block">✕ ' + randEncourage + '</b><p><b>正確答案：</b>' + String.fromCharCode(65 + qObj.ans) + '. ' + qObj.options[qObj.ans] + '</p><button type="button" onclick="nextQuizStep()" class="mt-2 px-3 py-1.5 rounded-lg bg-amber-600 text-white font-bold text-xs cursor-pointer">跳過並進入下一題 →</button>';
                }
            }
        }

        function nextQuizStep() { currentQuizIndex++; renderQuizQuestion(); }

            }

            if (planSelect) { 
                planSelect.innerHTML = ''; 
                var list = commissionData[catKey] || []; 
                for (var j = 0; j < list.length; j++) { 
                    var opt = document.createElement('option'); 
                    opt.value = j; 
                    opt.innerText = list[j].name; 
                    planSelect.appendChild(opt); 
                } 
            }
            updateCommAgeOptions();
        }

        function updateCommAgeOptions() {
            var planSelect = document.getElementById('planSelect'); 
            var ageSelect = document.getElementById('commAgeSelect'); 
            if (!planSelect || !ageSelect) return;
            var planIndex = parseInt(planSelect.value) || 0; 
            var list = commissionData[currentCategoryKey] || []; 
            var selectedPlan = list[planIndex];
            ageSelect.innerHTML = '';
            if (selectedPlan && selectedPlan.rates) {
                for (var k = 0; k < selectedPlan.rates.length; k++) { 
                    var rItem = selectedPlan.rates[k]; 
                    var opt = document.createElement('option'); 
                    opt.value = rItem.rate; 
                    opt.innerText = rItem.ages + ' (首年佣金: ' + (rItem.rate * 100).toFixed(2) + '%)'; 
                    ageSelect.appendChild(opt); 
                }
            }
            calculateCommission();
        }

        function calculateCommission() {
            var ageSelect = document.getElementById('commAgeSelect'); 
            var commRateEl = document.getElementById('commRate'); 
            var commResultEl = document.getElementById('commResult'); 
            var premInput = document.getElementById('premiumInput');
            if (!ageSelect || !commRateEl || !commResultEl || !premInput) return;
            var rate = parseFloat(ageSelect.value) || 0; 
            var premium = parseCleanNumber(premInput.value); 
            var comm = Math.round(premium * rate);
            commRateEl.innerText = (rate * 100).toFixed(2) + '%'; 
            commResultEl.innerText = 'HK$ ' + comm.toLocaleString('en-US');
        }

                };

                    std: { '10': 37.19, '15': 26.22, '20': 20.65, '25': 17.18, '30': 15.63 },
                    pro: { '10': 39.68, '15': 27.98, '20': 22.08, '25': 18.33, '30': 16.69 }
                };
                var tableKid = (curr === 'USD') ? (isPro ? kidRatesUSD.pro : kidRatesUSD.std) : (isPro ? kidRatesHKD.pro : kidRatesHKD.std);
                var kRate = tableKid[payTerm] || tableKid['20'];
                
                var kDisc = 0;
                if (curr === 'USD') {
                    if (sumInsured >= 60000) kDisc = (payTerm === '10' ? 10.0 : (payTerm === '15' ? 7.0 : (payTerm === '20' ? 5.0 : (payTerm === '25' ? 4.5 : 4.0))));
                    else if (sumInsured >= 30000) kDisc = (payTerm === '10' ? 6.0 : (payTerm === '15' ? 4.5 : 3.0));
                    else if (sumInsured >= 22500) kDisc = (payTerm === '10' ? 4.0 : (payTerm === '15' ? 3.0 : 2.0));
                } else {
                    if (sumInsured >= 480000) kDisc = (payTerm === '10' ? 10.0 : (payTerm === '15' ? 7.0 : (payTerm === '20' ? 5.0 : (payTerm === '25' ? 4.5 : 4.0))));
                    else if (sumInsured >= 240000) kDisc = (payTerm === '10' ? 6.0 : (payTerm === '15' ? 4.5 : 3.0));
                    else if (sumInsured >= 180000) kDisc = (payTerm === '10' ? 4.0 : (payTerm === '15' ? 3.0 : 2.0));
                }
                var finalKRate = Math.max(0, kRate - kDisc);
                return (finalKRate * sumInsured) / 1000;
            }

            var base20M_HKD = {
                1: 22.55, 2: 22.86, 3: 23.17, 4: 23.50, 5: 24.00, 6: 24.35, 7: 24.70, 8: 25.06, 9: 25.42, 10: 25.81,

                51: 66.66, 52: 68.20, 53: 69.75, 54: 71.37, 55: 73.02
            };

            var rBase = base20M_HKD[anb] || (anb < 1 ? 22.55 : 73.02 + (anb - 55) * 2.5);

            var termFactor = 1.0;
            if (payTerm === '10') termFactor = (anb <= 18 ? (46.76 / 24.70) : 1.90);
            else if (payTerm === '15') termFactor = (anb <= 18 ? (32.47 / 24.70) : 1.30);
            else if (payTerm === '20') termFactor = 1.00;
            else if (payTerm === '25') termFactor = (anb <= 18 ? (21.12 / 24.70) : 0.865);

            }

            var proFactor = 1.0;
            if (isPro) {
                proFactor = (anb <= 18 ? (26.52 / 24.70) : 1.07);
            }

            var familyFactor = 1.0;
            if (riderType === 'family') {
                familyFactor = (anb <= 18 ? (28.37 / 24.70) : 1.13);
            }

            var rateTypeFactor = 1.0;
            if (rateType === 'standard') {
                if (anb >= 19) rateTypeFactor = (payTerm === '10' ? 1.15 : (payTerm === '15' ? 1.12 : 1.10));
            }

            var baseUnitRate = rBase * termFactor * genderFactor * proFactor * familyFactor * rateTypeFactor;

            if (curr === 'USD') {
                baseUnitRate = baseUnitRate * 0.95;
            }

            var sizeDiscount = 0;
            if (curr === 'USD') {
                if (sumInsured >= 60000) sizeDiscount = (payTerm === '10' ? 10.0 : (payTerm === '15' ? 7.0 : (payTerm === '20' ? 5.0 : (payTerm === '25' ? 4.5 : 4.0))));
                else if (sumInsured >= 30000) sizeDiscount = (payTerm === '10' ? 6.0 : (payTerm === '15' ? 4.5 : 3.0));
                else if (sumInsured >= 22500) sizeDiscount = (payTerm === '10' ? 4.0 : (payTerm === '15' ? 3.0 : 2.0));
            } else {
                if (sumInsured >= 480000) sizeDiscount = (payTerm === '10' ? 10.0 : (payTerm === '15' ? 7.0 : (payTerm === '20' ? 5.0 : (payTerm === '25' ? 4.5 : 4.0))));
                else if (sumInsured >= 240000) sizeDiscount = (payTerm === '10' ? 6.0 : (payTerm === '15' ? 4.5 : 3.0));
                else if (sumInsured >= 180000) sizeDiscount = (payTerm === '10' ? 4.0 : (payTerm === '15' ? 3.0 : 2.0));
            }

            var finalAnnualRate = Math.max(0, baseUnitRate - sizeDiscount);
            return (finalAnnualRate * sumInsured) / 1000;
        }

        // AI Sammy 全平台滑鼠與觸控獨立拖曳核心
        function makeElementDraggable(dragHandle, container) {
            if (!dragHandle || !container) return;
            var isDragging = false;
            var hasMoved = false;
            var startX = 0, startY = 0;
            var initialLeft = 0, initialTop = 0;

            function startDrag(clientX, clientY) {
                isDragging = true;
                hasMoved = false;
                startX = clientX;
                startY = clientY;
                var rect = container.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
            }

            function moveDrag(clientX, clientY) {
                if (!isDragging) return;
                var dx = clientX - startX;
                var dy = clientY - startY;
                if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                    hasMoved = true;
                    var newLeft = initialLeft + dx;
                    var newTop = initialTop + dy;
                    var maxLeft = window.innerWidth - container.offsetWidth - 10;
                    var maxTop = window.innerHeight - container.offsetHeight - 10;
                    newLeft = Math.max(10, Math.min(newLeft, maxLeft));
                    newTop = Math.max(10, Math.min(newTop, maxTop));
                    container.style.position = 'fixed';
                    container.style.left = newLeft + 'px';
                    container.style.top = newTop + 'px';
                    container.style.bottom = 'auto';
                    container.style.right = 'auto';
                }
            }

            function endDrag() {
                isDragging = false;
            }

            dragHandle.addEventListener('mousedown', function(e) {
                if (e.target.tagName === 'INPUT' || (e.target.tagName === 'BUTTON' && e.target !== dragHandle)) return;
                startDrag(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', function(e) {
                moveDrag(e.clientX, e.clientY);
            });
            window.addEventListener('mouseup', endDrag);

            dragHandle.addEventListener('touchstart', function(e) {
                if (e.touches.length > 0) {
                    var touch = e.touches[0];
                    startDrag(touch.clientX, touch.clientY);
                }
            }, { passive: true });
            window.addEventListener('touchmove', function(e) {
                if (e.touches.length > 0) {
                    var touch = e.touches[0];
                    moveDrag(touch.clientX, touch.clientY);
                }
            }, { passive: true });
            window.addEventListener('touchend', endDrag);
        }

        // 頁面載入安全執行入口
        window.onload = function() {
            try {
                switchPage('page-home');
                
                var defaultBtn = document.querySelector('.comm-category-item'); 
                if (defaultBtn) setCommCategory('whole_life', defaultBtn); 
                
                updateCalcOptions(); 
                updateAuthUI();
                
                var aiContainer = document.getElementById('aiFloatingContainer');
                var aiHeader = document.getElementById('aiWindowHeader');
                var aiTriggerBtn = document.getElementById('aiTriggerBtn');

                if (aiHeader && aiContainer) makeElementDraggable(aiHeader, aiContainer);
                if (aiTriggerBtn && aiContainer) makeElementDraggable(aiTriggerBtn, aiContainer);
            } catch(e) {
                console.error("Initialization Error:", e);
            }
        };
    </script>
</body>
</html>
